name: build
on: [push, workflow_dispatch]
jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - run: go mod init aegis && go get github.com/miekg/dns && go mod tidy
      - run: GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o aegis.exe
      - uses: actions/upload-artifact@v4
        with: { name: aegis-windows, path: aegis.exe }
